<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>TaskFlow | Gerenciador de Tarefas</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
  />

  <link
    rel="stylesheet"
    href="./src/css/style.css"
  />
</head>

<body>

  <main class="app">

    <header class="header">

      <div>
        <h1>TaskFlow</h1>
        <p>Organize suas tarefas com eficiência.</p>
      </div>

      <button
        id="themeToggle"
        class="theme-btn"
        aria-label="Alternar tema"
      >
        🌙
      </button>

    </header>

    <section class="task-form">

      <input
        type="text"
        id="taskInput"
        placeholder="Digite uma tarefa..."
      />

      <select id="priority">

        <option value="high">
          🔴 Alta
        </option>

        <option value="medium">
          🟡 Média
        </option>

        <option value="low">
          🟢 Baixa
        </option>

      </select>

      <button id="addTaskBtn">
        Adicionar
      </button>

    </section>

    <section class="toolbar">

      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Buscar tarefa..."
      />

      <div class="filters">

        <button
          class="filter-btn active"
          data-filter="all"
        >
          Todas
        </button>

        <button
          class="filter-btn"
          data-filter="pending"
        >
          Pendentes
        </button>

        <button
          class="filter-btn"
          data-filter="completed"
        >
          Concluídas
        </button>

      </div>

    </section>

    <section class="stats">

      <div class="stat-card">
        <span id="totalTasks">0</span>
        <small>Total</small>
      </div>

      <div class="stat-card">
        <span id="completedTasks">0</span>
        <small>Concluídas</small>
      </div>

      <div class="stat-card">
        <span id="pendingTasks">0</span>
        <small>Pendentes</small>
      </div>

    </section>

    <ul id="taskList" class="task-list"></ul>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <script
    type="module"
    src="./src/js/app.js"
  ></script>

</body>
</html>
